<title>Somando com os Dedinhos</title>
<meta name="description" content="Folha autoral de adição até 10 com os dedos das mãos (Pré e 1º ano): contar, digitar, ligar e mostrar com os dedos, com voz em tudo e somas sorteadas a cada abertura.">
<!-- ============================================================
     SOMANDO COM OS DEDINHOS — a 1ª FOLHA AUTORAL (8/set/2026)
     Nasceu do teste da "folha viva" (a folha de PDF resolvida no computador) e das
     ordens do Marcos que vieram em seguida: *"criar a mesma coisa só que por você,
     mudando algo do conteúdo, cores, imagens, para ser algo autoral"*, *"sempre
     remover cabeçalho"*, *"variar as somas, para não dar o mesmo resultado sempre"*.
     O MODELO foram 40 folhas reais de "adição com os dedos" achadas pela busca de
     imagem (_pesquisa/fotos/ddg-soma-dedos): mão + mão = quadradinho, ligar mãos ao
     número, mostrar com os dedos. Daqui em diante, nada é copiado:
       · as MÃOS são desenhadas em vetor (SVG), com o número EXATO de dedos — gerador
         de imagem erra dedo, e numa folha de contar dedo isso é fatal;
       · as SOMAS são SORTEADAS a cada abertura (resultados vizinhos nunca iguais);
       · não há cabeçalho de escola/data: o nome da criança fica numa barra nossa;
       · voz da casa em tudo (FALAS enumeradas pelo gerar_falas.py, mp3 pelo
         entregar.yml); erro nunca é "errou"; retoma 55 min; relatório na medalha.
     ES5 puro (Chrome 109 / Firefox 106), um arquivo, sem biblioteca.
     ============================================================ -->
<style>

<header id="topo">

function sorteiaPares(qtd, minT, maxT){
  /* pares (a,b) com 1..5 cada, total entre minT e maxT, resultados vizinhos DIFERENTES */
  var out = [], tent = 0, ult = -1;
  while(out.length < qtd && tent < 500){
    tent++;
    var a = 1 + rnd(5), b = 1 + rnd(5), t = a + b;
    if(t < minT || t > maxT || t === ult) continue;
    var rep = false; for(var i = 0; i < out.length; i++) if(out[i][0] === a && out[i][1] === b) rep = true;
    if(rep) continue;
    out.push([a, b]); ult = t;
  }
  return out;
}
function sorteiaAlvos(qtd, minT, maxT){ var out = [], ult = -1, tent = 0; while(out.length < qtd && tent < 300){ tent++; var t = minT + rnd(maxT - minT + 1); if(t === ult || out.indexOf(t) > -1) continue; out.push(t); ult = t; } return out; }
function sorteiaFaltam(qtd){
  var out = [], tent = 0, ult = -1;
  while(out.length < qtd && tent < 500){ tent++; var a = 1 + rnd(5), t = a + 1 + rnd(5); if(t > 10 || t === ult) continue; var rep = false; for(var i = 0; i < out.length; i++) if(out[i][0] === a && out[i][1] === t) rep = true; if(rep) continue; out.push([a, t]); ult = t; }
  return out;
}
function novaFolha(){
  var p3 = sorteiaPares(4, 3, 10), nums = [], i;
  for(i = 0; i < p3.length; i++) nums.push(p3[i][0] + p3[i][1]);
  /* garante numeros distintos no ligar */
  var vist = {}, ok = true; for(i = 0; i < nums.length; i++){ if(vist[nums[i]]) ok = false; vist[nums[i]] = 1; }
  if(!ok) return novaFolha();
  return {p1: sorteiaPares(4, 2, 6), p2: sorteiaPares(4, 6, 10), p3: p3, p4: sorteiaAlvos(4, 1, 10), p5: sorteiaFaltam(4), peles: [rnd(5), rnd(5), rnd(5), rnd(5), rnd(5)]};
}

function montaFaltam(d, pi){
  faixa(d, pi, "Quantos faltam?");
  d.appendChild(el("div", "enun", "Uma mão já mostra dedos. <b>Levante dedos na outra</b> até juntar a quantidade pedida e toque em <b>Pronto</b>."));
  var itens = ST.folha.p5, box = el("div", "mostrar"); d.appendChild(box);
  var rod = ST.mostra["r" + pi] || 0;
  function rodada(){
    if(rod >= itens.length){ box.innerHTML = '<div class="igual ok">Você completou todas!</div>' + bolinhas(); return; }
    var a = itens[rod][0], t = itens[rod][1], upE = upDe(a), upD = [false, false, false, false, false];
    box.innerHTML = '<div class="alvo"><span class="txt">Juntar</span><span class="grande">' + t + '</span><span class="txt">dedos</span></div><div class="maos2" id="m2_' + pi + '"></div><div class="igual" id="ig_' + pi + '">' + a + ' + <span id="b_' + pi + '">?</span> = ' + t + '</div><div style="text-align:center;margin-top:8px"><button class="bt verde" id="pr_' + pi + '" data-qa="pronto">Pronto!</button></div>' + bolinhas();
    var bEl = box.querySelector("#b_" + pi);
    maosVivas(box.querySelector("#m2_" + pi), upE, upD, pi, function(){ bEl.textContent = conta(upD); }, true);
    falar("falta" + a + "_" + t);
    box.querySelector("#pr_" + pi).onclick = function(){
      var n = conta(upD), id = "f" + pi + "_" + rod;
      if(a + n === t){ tentativa(id, true); rod++; ST.mostra["r" + pi] = rod; salvar(); box.querySelector("#ig_" + pi).className = "igual ok"; sCerto(); falar("fechou" + a + "_" + t); setTimeout(rodada, 1600); if(rod >= itens.length) setTimeout(function(){ confereFolha(pi); }, 1800); }
      else { tentativa(id, false); sErro(); var k = Math.abs(t - a - n); falar("levantou" + (a + n), null, function(){ falar(a + n < t ? "faltam" + k : "sobram" + k); }); }
    };
  }
  function bolinhas(){ var h = '<div class="rodadas">'; for(var i = 0; i < itens.length; i++) h += '<i class="' + (i < rod ? "feita" : (i === rod ? "atual" : "")) + '"></i>'; return h + '</div>'; }
  d._rodada = rodada; rodada();
}

/* ---------- pagina pronta / navegacao ---------- */
function pendentes(pi){
  var n = 0, i;
  if(pi === 1 || pi === 2){ var pares = parDe(pi, 0) ? (pi === 1 ? ST.folha.p1 : ST.folha.p2) : []; for(i = 0; i < pares.length; i++) if(ST.resp["r" + pi + "_" + i] !== pares[i][0] + pares[i][1]) n++; }
  else if(pi === 3){ for(i = 0; i < ST.folha.p3.length; i++) if(!ST.lig["l3_k" + i]) n++; }
  else if(pi === 4){ n = ST.folha.p4.length - (ST.mostra["r4"] || 0); }
  else if(pi === 5){ n = ST.folha.p5.length - (ST.mostra["r5"] || 0); }
  return n;
}
function confereFolha(pi){
  if(pendentes(pi) > 0 || ST.prontas[pi]) return;
  ST.prontas[pi] = 1; salvar();
  PAGEL[pi].className += " pronta"; sFesta(); confete(24);
  if(pi < PAGEL.length - 1){ falar("paginaPronta"); setTimeout(function(){ if(ST.pag === pi) vaiPara(pi + 1); }, 2600); }
  else { setTimeout(fim, 1400); }
  atualizaNav();
}
function espelhaNome(t){ var n = document.getElementById("nomef"); if(n){ n.textContent = t || "escreva o seu nome ali embaixo"; n.className = t ? "nomef" : "nomef vazio"; } var i = document.getElementById("nomeIn"); if(i && i.value !== t) i.value = t; }
function vaiPara(pi){
  calar(); if(ATIVA){ ATIVA.el.className = ATIVA.el.className.indexOf("certa") > -1 ? "resp certa" : "resp"; if(ATIVA.el.className === "resp") ATIVA.el.innerHTML = '<i class="zi"></i>'; ATIVA = null; }
  document.getElementById("teclado").className = "";
  document.getElementById("barraCapa").className = pi === 0 ? "aberta" : "";
  if(pi === 0) espelhaNome(ST.nome || "");
  document.getElementById("fim").style.display = "none"; document.getElementById("retomar").style.display = "none"; document.getElementById("nav").style.display = pi === 0 ? "none" : "flex"; document.getElementById("nav").style.display = "flex";
  for(var i = 0; i < PAGEL.length; i++) PAGEL[i].className = PAGEL[i].className.replace(" viva", "");
  ST.pag = pi; salvar();
  var d = PAGEL[pi]; d.className += " viva";
  if(pi > 0) window.scrollTo(0, 0);
  if(d._redesenha){ setTimeout(d._redesenha, 60); }
  atualizaNav();
  if(pi === 0) falarDepois("capa", 300);
  else falarDepois("p" + pi + "enun", 250);
}
function atualizaNav(){
  var pi = ST.pag, total = PAGEL.length;
  document.getElementById("pg").textContent = pi === 0 ? "Capa" : "Página " + pi + " de " + (total - 1);
  var feitas = 0; for(var k in ST.prontas) feitas++;
  document.getElementById("progI").style.width = (feitas / (total - 1) * 100) + "%";
  document.getElementById("bAnt").disabled = pi === 0;
  var prox = document.getElementById("bProx");
  prox.style.visibility = pi === 0 ? "hidden" : "visible";
  var pend = pi > 0 ? pendentes(pi) : 0;
  prox.textContent = pi === total - 1 ? (pend ? "Faltam " + pend : "Ver o resultado ★") : (pend ? "Faltam " + pend + " ▶" : "Próxima ▶");
  prox.className = pend ? "bt cinza" : "bt verde";
  document.getElementById("navTxt").textContent = pi === 0 ? "" : NOMES[pi - 1];
}
document.getElementById("bAnt").onclick = function(){ sPasso(); if(ST.pag > 0) vaiPara(ST.pag - 1); };
document.getElementById("bProx").onclick = function(){
  sPasso(); var pi = ST.pag, pend = pendentes(pi);
  if(pend){ falar("faltam"); var r = PAGEL[pi].querySelector(".resp:not(.certa), .ponta:not(.feita), .mostrar"); if(r){ r.className += " treme"; setTimeout(function(){ r.className = r.className.replace(" treme", ""); }, 500); try{ r.scrollIntoView({behavior: "smooth", block: "center"}); }catch(e){} } return; }
  if(pi < PAGEL.length - 1) vaiPara(pi + 1); else fim();
};
document.getElementById("bOuvir").onclick = function(){ sPasso(); var b = this; if(document.getElementById("fim").style.display === "block"){ falar("fim", b); return; } if(ST.pag === 0){ falar("capa", b); return; } falar("p" + ST.pag + "enun", b); };
document.getElementById("bVoz").onclick = function(){ vozLigada = !vozLigada; var b = document.getElementById("bVoz"); if(vozLigada){ b.className = "zap"; falar("vozOn"); } else { calar(); b.className = "zap off"; } };
document.getElementById("nomeIn").oninput = function(){ ST.nome = this.value.slice(0, 24); espelhaNome(ST.nome); salvar(); };
document.getElementById("nomeIn").onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); this.blur(); if(ST.nome) falar("nomeOk"); } };
document.getElementById("bComecar").onclick = function(){ ac(); sPasso(); if(!ST.inicio) ST.inicio = Date.now(); vaiPara(1); };

function confete(n){ var cs = ["#f5b400", "#43a047", "#1d4ed8", "#e53935", "#8e24aa"]; for(var i = 0; i < n; i++){ var c = el("div", "confete"); c.style.left = (Math.random() * 100) + "vw"; c.style.background = cs[i % cs.length]; c.style.animationDelay = (Math.random() * .5) + "s"; document.body.appendChild(c); setTimeout((function(x){ return function(){ if(x.parentNode) x.parentNode.removeChild(x); }; })(c), 2600); } }

/* ---------- fim ---------- */
var _segura = null;
function itensDaPagina(pi){ var ids = [], i; if(pi === 1 || pi === 2) for(i = 0; i < 4; i++) ids.push("r" + pi + "_" + i); if(pi === 3) for(i = 0; i < 4; i++) ids.push("l3_k" + i); if(pi === 4) for(i = 0; i < 4; i++) ids.push("m4_" + i); if(pi === 5) for(i = 0; i < 4; i++) ids.push("f5_" + i); return ids; }
function fim(){
  calar(); for(var i = 0; i < PAGEL.length; i++) PAGEL[i].className = PAGEL[i].className.replace(" viva", "");
  document.getElementById("teclado").className = ""; document.getElementById("barraCapa").className = ""; document.getElementById("nav").style.display = "none";
  var f = document.getElementById("fim"); f.style.display = "block"; window.scrollTo(0, 0);
  sFesta(); confete(60); falar("fim");
  var tot = 0, prim = 0, k; for(k in ST.tent){ tot++; if(ST.tent[k].erros === 0) prim++; }
  var est = document.getElementById("estrelas"); est.innerHTML = "";
  var n = prim >= tot * .85 ? 3 : (prim >= tot * .6 ? 2 : 1);
  for(i = 0; i < 3; i++){ var s = el("div", "estrela", '<svg viewBox="0 0 24 24" width="48" height="48"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.2l1.5-7L2 9.4l7-.8z" fill="' + (i < n ? "#f5b400" : "#e6dcc4") + '" stroke="#b98400" stroke-width="1"/></svg>'); est.appendChild(s); setTimeout((function(x){ return function(){ x.className = "estrela acesa"; }; })(s), 300 + i * 350); }
  var bar = document.getElementById("barras"); bar.innerHTML = "";
  for(var pi = 1; pi <= 5; pi++){ (function(pi){ var ids = itensDaPagina(pi), t = ids.length, p = 0; for(var j = 0; j < ids.length; j++){ var tt = ST.tent[ids[j]]; if(tt && tt.erros === 0 && tt.ok) p++; } var b = el("div", "barra", "<span>" + NOMES[pi - 1] + "</span><div class='tr'><i></i></div><b>" + p + "/" + t + "</b>"); bar.appendChild(b); setTimeout(function(){ b.querySelector("i").style.width = (t ? p / t * 100 : 0) + "%"; }, 400); })(pi); }
  document.getElementById("fimTxt").textContent = (ST.nome ? ST.nome + ", você" : "Você") + " acertou de primeira " + prim + " de " + tot + " itens.";
  document.getElementById("relatorio").style.display = "none";
}
(function(){
  var m = document.getElementById("medalha");
  function comeca(ev){ ev.preventDefault(); m.className = "medalha segurando"; _segura = setTimeout(function(){ m.className = "medalha"; relatorio(); }, 2000); }
  function solta(){ m.className = "medalha"; if(_segura){ clearTimeout(_segura); _segura = null; } }
  m.addEventListener("pointerdown", comeca); m.addEventListener("pointerup", solta); m.addEventListener("pointerleave", solta); m.addEventListener("pointercancel", solta);
})();
function relatorio(){
  var r = document.getElementById("relatorio"), h = "<b>Relatório do professor</b> — " + (ST.nome || "(sem nome)") + " · " + Math.round(((Date.now() - (ST.inicio || Date.now())) / 60000)) + " min<table><tr><th>Item</th><th>Erros antes de acertar</th></tr>";
  var tot = 0, prim = 0, ruins = [];
  for(var pi = 1; pi <= 5; pi++){ var ids = itensDaPagina(pi); for(var j = 0; j < ids.length; j++){ var t = ST.tent[ids[j]]; tot++; var e = t ? t.erros : "—"; if(t && t.erros === 0) prim++; var nome = NOMES[pi - 1] + " · item " + (j + 1); if(t && t.erros >= 2) ruins.push(nome); h += "<tr><td>" + nome + "</td><td>" + e + "</td></tr>"; } }
  var parecer = prim >= tot * .85 ? "Dominou a contagem e a soma até 10 com apoio dos dedos." : (prim >= tot * .6 ? "Está construindo: acerta, mas ainda conta de novo em alguns itens." : "Precisa retomar a contagem um a um com os dedos e material concreto.");
  h += "</table><p><b>Parecer:</b> " + parecer + (ruins.length ? "<br><b>Itens com 2 ou mais tentativas:</b> " + ruins.join("; ") : "") + "</p><p style='color:#6b4a1a'>Esta folha foi sorteada: as somas mudam a cada abertura.</p>";
  r.innerHTML = h; r.style.display = "block"; falar("fimRel");
}
document.getElementById("bRever").onclick = function(){ sPasso(); vaiPara(1); };
document.getElementById("bRecomecar").onclick = function(){ sPasso(); try{ localStorage.removeItem(CHAVE_LS); }catch(e){} ST = {pag: 0, nome: ST.nome, folha: novaFolha(), resp: {}, lig: {}, mostra: {}, tent: {}, prontas: {}, inicio: 0}; monta(); vaiPara(0); falarDepois("novaFolha", 400); };

/* ---------- retomar ---------- */
(function(){
  var salvo = carregar();
  monta();
  if(salvo && salvo.pag > 0 && !(salvo.prontas && salvo.prontas[5])){
    document.getElementById("retomar").style.display = "block";
    document.getElementById("retTxt").textContent = (salvo.nome ? salvo.nome + ", você" : "Você") + " estava na página " + salvo.pag + ". Quer continuar de onde parou?";
    document.getElementById("bRetSim").onclick = function(){ ST = salvo; monta(); vaiPara(salvo.pag); };
    document.getElementById("bRetNao").onclick = function(){ try{ localStorage.removeItem(CHAVE_LS); }catch(e){} ST.folha = novaFolha(); monta(); vaiPara(0); };
    PAGEL[0].className += " viva"; atualizaNav(); falarDepois("retomar", 400);
  } else { vaiPara(0); }
  var destrava = function(){ ac(); document.removeEventListener("pointerdown", destrava); document.removeEventListener("keydown", destrava); };
  document.addEventListener("pointerdown", destrava); document.addEventListener("keydown", destrava);
})();
</script>
